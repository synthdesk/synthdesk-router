[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "synthdesk-router"
version = "0.2.0"
description = "Constitutional restraint engine - epistemic state synthesis runtime"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=41.0.0",
    "PyYAML>=6.0",
    "numpy>=1.23",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools]
packages = [
  "router",
  "router.utils",
  "observer",
  "observer.flow",
  "synthdesk_spine",
  "synthdesk_spine.payloads",
]

[tool.setuptools.package-dir]
router = "router"
observer = "packages/observer"

[tool.pytest.ini_options]
testpaths = ["tests"]
