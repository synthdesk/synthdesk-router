name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - feat/**

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        if: matrix.python-version != '3.9'
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Install test deps (py3.9 source mode)
        if: matrix.python-version == '3.9'
        run: |
          python -m pip install --upgrade pip
          pip install pytest cryptography pyyaml numpy

      - name: Compile router entrypoint
        run: python -m py_compile router/main.py

      - name: Run tests
        run: |
          if [ "${{ matrix.python-version }}" = "3.9" ]; then
            PYTHONPATH=. pytest -q
          else
            pytest -q
          fi
